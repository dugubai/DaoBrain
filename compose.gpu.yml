services:
  ollama:
    image: docker.m.daocloud.io/ollama/ollama:0.40.9
    volumes:
      - /root/.ollama:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "30s"
      OLLAMA_FLASH_ATTENTION: "0"
  local_model:
    environment:
      LOCAL_MODEL_BACKEND: ollama
      LOCAL_MODEL_NAME: qwen2.5:0.5b
      OLLAMA_URL: http://ollama:11434
      MODEL_OUTPUT_PROTOCOL: select
  gateway:
    environment:
      GATEWAY_GREEN_BACKEND: local_ollama
  hybrid_iface:
    environment:
      GATEWAY_GREEN_BACKEND: local_ollama
      LOCAL_MODEL_BACKEND: ollama
      LOCAL_MODEL_NAME: qwen2.5:0.5b

  dashboard:
    image: daobrain-app:dev
    depends_on: [postgres]
    init: true
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "10001:10001"
    mem_limit: 320m
    cpus: "1.0"
    restart: unless-stopped
    env_file: .env
    command: ["uvicorn","dashboard.main:app","--host","0.0.0.0","--port","8020"]
    volumes:
      - /var/lib/daobrain-ops:/var/lib/daobrain-ops:ro
    environment:
      GATEWAY_GREEN_BACKEND: local_ollama
    networks: [green, web]
    ports: ["127.0.0.1:8020:8020"]

  topology:
    user: "10001:10001"
    group_add: ["992"]
    image: daobrain-app:dev
    init: true
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 160m
    cpus: "0.5"
    restart: unless-stopped
    command: ["python","ops/topology_server.py"]
    environment:
      TOPO_PORT: "8021"
      TOPO_INTERVAL: "6"
    networks: [web]

networks:
  web:
    internal: false
