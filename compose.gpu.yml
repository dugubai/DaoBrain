services:
  ollama:
    image: docker.m.daocloud.io/ollama/ollama:0.40.9
    volumes:
      - /root/.ollama:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "30s"
      OLLAMA_FLASH_ATTENTION: "0"
  local_model:
    environment:
      LOCAL_MODEL_BACKEND: ollama
      LOCAL_MODEL_NAME: qwen2.5:0.5b
      OLLAMA_URL: http://ollama:11434
      MODEL_OUTPUT_PROTOCOL: select
  gateway:
    environment:
      GATEWAY_GREEN_BACKEND: local_ollama
  hybrid_iface:
    environment:
      GATEWAY_GREEN_BACKEND: local_ollama
      LOCAL_MODEL_BACKEND: ollama
      LOCAL_MODEL_NAME: qwen2.5:0.5b

  dashboard:
    image: daobrain-app:dev
    depends_on: [postgres]
    init: true
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "10001:10001"
    mem_limit: 320m
    cpus: "1.0"
    restart: unless-stopped
    env_file: .env
    command: ["uvicorn","dashboard.main:app","--host","0.0.0.0","--port","8020"]
    environment:
      GATEWAY_GREEN_BACKEND: local_ollama
    networks: [green, web]
    ports: ["127.0.0.1:8020:8020"]

networks:
  web:
    internal: false
