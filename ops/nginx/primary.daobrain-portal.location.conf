# Only the fixed, non-confidential sample interface is public.
location = /daobrain {
    return 302 /daobrain/;
}
location ^~ /daobrain/ {
    client_max_body_size 256;
    client_body_timeout 5s;
    limit_req zone=daobrain_public_ip burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://10.255.1.2:18100/;
    proxy_set_header Host $host;
    proxy_set_header X-API-Key "";
    proxy_set_header X-Internal-Key "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_connect_timeout 3s;
    # CPU模型服务最多120秒；Nginx先于浏览器125秒限制会截断真实推理。
    proxy_read_timeout 123s;
    proxy_send_timeout 5s;
    proxy_intercept_errors off;
    proxy_set_header Accept-Encoding "";
    sub_filter_once off;
    sub_filter '</main>' '</main><nav style="max-width:960px;margin:22px auto 0;padding:0 22px;display:flex;gap:12px;flex-wrap:wrap"><a style="background:#145a47;color:#fff;padding:11px 18px;border-radius:9px;text-decoration:none" href="/daobrain/dash/">数据流量大盘 →</a><a style="border:1px solid #145a47;color:#145a47;padding:11px 18px;border-radius:9px;text-decoration:none" href="/manage/">管理控制台 →</a></nav>';
}
